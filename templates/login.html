<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion · StockPro</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="login-page"><form class="login-card" method="post"><input type="hidden" name="_csrf_token" value="{{ session['_csrf_token'] }}"><div class="brand-mark">⚙️</div><h1>Stock<span>Pro</span></h1><p>Moto-Auto · Gestion intelligente du stock</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="notice">{{m}}</div>{% endfor %}{% endwith %}<label>Nom d'utilisateur<input name="username" required autocomplete="username" placeholder="admin"></label><label>Mot de passe<input type="password" name="password" required autocomplete="current-password" placeholder="Votre mot de passe"></label><button class="primary wide">Se connecter</button><small>Première connexion : admin / Admin@12345. Changez le mot de passe avant toute utilisation réelle.</small></form></body></html>
